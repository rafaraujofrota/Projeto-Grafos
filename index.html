<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grafos</title>
    <style>
      .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

      label { display: flex; gap: 6px; align-items: center; }
      button { padding: 6px 12px; cursor: pointer; }
      canvas { max-width: 100%; border: 1px solid #333; margin: 32px 0 32px 0;}

      .canvasContainer { display: flex; width: 100%; justify-content: center; }
      .currentData {  
        padding: 8px; border: 2px solid gray; border-radius: 8px; 
        width: fit-content; margin: auto; margin-bottom: 16px;
      }
      .tableTitle { 
        background-color: lightgray; align-items: center; font-weight: bold;
        border: 1px solid black; white-space: nowrap;
      }
      .table {
        display: grid; width: 80%;
        margin: auto; margin-top: 32px; text-align: center; justify-content: center;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      .table > div { 
        border: 1px solid black; padding: 8px; 
        display: flex; justify-content: center; align-items: center;
      }
      @media (max-width: 768px) {
        .table {
          width: 95%; grid-auto-flow: column;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(9, auto);
        }
        .tableTitle { white-space: normal }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>Salas<input id="rooms" type="range" min="15" max="50" value="15"></label>
      <label>Ciclos<input id="loops" type="range" min="0" max="100" value="0"></label>
      <button id="generate">Gerar</button>
      <button id="simplify">Simplificar</button>
      <button id="simplifyMax">SimplificarMáximo</button>
    </div>
    <div class="canvasContainer">
      <canvas id="canvas" width="1200" height="800">
    </div>
    <div class="currentData">
      <span id="dataText"></span>
    </div>
    <div class="controls" style="justify-content: center;">
      <button id="startExperiment">Rodar Experimento</button>
      <button id="getOriginal">Ver Original</button>
      <button id="getMiddle">Ver Intermediaria</button>
      <button id="getFinal">Ver Final</button>
      <button id="getDefault">Carregar Default</button>
      <button id="export">Exportar</button>
      <button id="import">Importar</button>
    </div>
    <div class="table" id="table"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
